[mypy]
python_version = 3.12
strict = True
# Unused-section warnings would fire here because pyforge/ does not yet import
# numba / pyarrow / py_spy. Re-enable once Step 1+ start referencing them.
warn_unused_configs = False
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True
pretty = True
files = pyforge

# Third-party packages without type stubs.
[mypy-numba.*]
ignore_missing_imports = True

[mypy-py_spy.*]
ignore_missing_imports = True

[mypy-pyarrow.*]
ignore_missing_imports = True

[mypy-posix_ipc]
ignore_missing_imports = True

# Tests and benchmarks are exempt from strict typing.
[mypy-tests.*]
ignore_errors = True

[mypy-benchmarks.*]
ignore_errors = True
