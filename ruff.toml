line-length = 100
target-version = "py312"
extend-exclude = ["benchmarks/results", ".venv", "build", "dist"]

[lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
  "N",    # pep8-naming
  "PL",   # pylint
  "PTH",  # flake8-use-pathlib
]
ignore = [
  "E501",    # line length handled by formatter
  "PLR0913", # too many arguments
  "PLR2004", # magic values — common in numeric code
]

[lint.per-file-ignores]
# PLC2701: tests intentionally access private symbols (e.g. _hash_name).
# RUF012: FeatureSchema subclasses inherit ClassVar from the base; tests
#         define many local ones and re-annotating every one is noise.
# PLR2004 / S101 / PLR0915: common in concise test code.
# PLC0415: tests legitimately import inside functions (subprocess targets,
#          lazy schema imports after skipif gate).
"tests/**" = ["PLR2004", "S101", "PLR0915", "PLC2701", "RUF012", "PLC0415"]
"benchmarks/**" = ["PLR2004", "PLC2701", "RUF012", "PLC0415"]

[lint.isort]
# `_helpers` lives in tests/_helpers.py and is importable thanks to
# pythonpath = ["tests"] in pyproject.toml. Without this, ruff classifies it
# as third-party and demands a blank line between `import numpy` and
# `from _helpers import ...`. Treating both pyforge and _helpers as
# first-party keeps the import order natural.
known-first-party = ["pyforge", "_helpers"]

[format]
quote-style = "double"
indent-style = "space"
