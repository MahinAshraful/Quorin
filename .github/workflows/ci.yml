name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 1s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy quorin

      - name: Pytest (unit + integration)
        env:
          QUORIN_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          uv run pytest tests/unit tests/integration \
            --cov=quorin \
            --cov-report=term-missing \
            --cov-fail-under=0
        # NOTE: --cov-fail-under raised to 85 once real code lands (Step 1+).
