name: benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      record_flamegraphs:
        description: "Capture py-spy --native flamegraphs (manual + slow)"
        required: false
        default: "false"
      run_large_shm_bench:
        description: "Opt into bench_upgrade_1m_50_field (~3.2 GB segment; ubuntu-latest WILL SIGBUS — set true only on a runner with adequate /dev/shm)"
        required: false
        default: "false"
  schedule:
    # Weekly Tier-2 N=20 orchestrator pass at 06:00 UTC Monday. ~30-60 min.
    # Catches drift in the headline benches that Tier-1's per-PR runs don't
    # surface (single-process pytest-benchmark hides tail variance per
    # Step 7's expensive lesson). Output JSON committed to
    # benchmarks/results/n20/ via a follow-up PR (manual; CI uploads as
    # artifacts only).
    - cron: "0 6 * * 1"

jobs:
  bench:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 1s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history for --benchmark-compare

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      # Numba writes .nbi (signature index) + .nbc (LLVM bitcode) into
      # <module>/__pycache__/ next to .py files. Caching these avoids paying
      # ~300 ms first-call compile per subprocess in the Tier-2 orchestrator.
      # Two-level key: uv.lock invalidates on dep version changes (a Numba
      # bump produces incompatible bitcode → LOAD-time error mid-bench
      # rather than recompile); source file hashes invalidate on kernel
      # edits. Restore-keys cascade falls back to "any source" — Numba's
      # internal source-hash check (separate from this cache key) evicts
      # mismatched .nbc on load and recompiles cleanly, so partial restore
      # is correctness-safe (worst case: redundant recompile).
      - name: Numba JIT cache
        uses: actions/cache@v4
        with:
          path: |
            pyforge/__pycache__
            pyforge/_internal/__pycache__
          key: numba-jit-${{ runner.os }}-py3.12-${{ hashFiles('uv.lock') }}-${{ hashFiles('pyforge/assembly.py', 'pyforge/_internal/insert_kernel.py') }}
          restore-keys: |
            numba-jit-${{ runner.os }}-py3.12-${{ hashFiles('uv.lock') }}-
            numba-jit-${{ runner.os }}-py3.12-

      # ==========================================================
      # Tier-1: always-run regression gates. PR-blocking. <1 min total.
      # ==========================================================
      - name: Run benchmarks (Tier-1)
        env:
          PYFORGE_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          uv run pytest benchmarks/ \
            --benchmark-only \
            --benchmark-autosave \
            --benchmark-save-data \
            --benchmark-storage=benchmarks/results \
            -m "not slow"

      - name: Check Tier-1 thresholds
        run: uv run python benchmarks/regression/check.py --strict

      # ==========================================================
      # Tier-2 (LARGE + RECORD): env-gated heavy benches.
      # workflow_dispatch + schedule ONLY. NOT push.
      #
      # Reality discovered on Step 16a's first push run: GitHub Actions
      # ubuntu-latest /dev/shm (~3.5 GB tmpfs default) cannot reliably
      # host the heavy benches in a single pytest session — segment
      # accumulation across benches + insert_many's transient column-
      # major buffers push memory over the limit. SIGBUS at exit 135
      # observed on 100k hydration AND 1M evolution.
      #
      # Pre-Step-16 CI worked here only because env gates were silent
      # skip-on-missing-env. Step 16a tried to run heavy benches on
      # push — that exposed the structural ubuntu-latest memory limit.
      #
      # Push runs Tier-1 only (~30s, fits comfortably). Dispatch runs
      # the full suite; schedule runs everything except heavy-shm
      # benches gated by PYFORGE_RUN_LARGE_SHM_BENCH (Step 16b: those
      # exceed ubuntu-latest's /dev/shm ceiling — bench_upgrade_1m
      # is the canonical example, ~3.2 GB segment vs ~3.5 GB tmpfs).
      # If a future need wants automated heavy-shm coverage, options
      # are: ubuntu-latest-large (16-core, 64 GB, ~$0.20/run),
      # self-hosted runner, or the benchmarks/runs/repeat.py
      # orchestrator pattern (each bench in a fresh subprocess —
      # sidesteps accumulation).
      # ==========================================================
      - name: Run benchmarks (Tier-2 LARGE + RECORD)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          PYFORGE_REDIS_URL: redis://127.0.0.1:6379/0
          PYFORGE_RUN_LARGE_BENCH: "1"
          PYFORGE_RUN_RECORD_BENCH: "1"
          # Step 16b Rev-8: heavy-shm benches gate on EXPLICIT operator opt-in
          # via workflow_dispatch input. `gh workflow run benchmark.yml` (no
          # flags) leaves this UNSET → bench skipif fires → bench skipped →
          # workflow stays green so downstream MADV A/B step runs. Operators
          # with adequate /dev/shm pass `-f run_large_shm_bench=true` to
          # enable. ubuntu-latest cannot host bench_upgrade_1m_50_field
          # (~3.2 GB segment) regardless of trigger event (ADR-015 §7).
          # The Rev-7 "auto-set on workflow_dispatch" assumption was wrong:
          # `gh workflow run` defaults to ubuntu-latest, same constrained
          # box as schedule.
          PYFORGE_RUN_LARGE_SHM_BENCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_large_shm_bench == 'true' && '1' || '' }}
        run: |
          uv run pytest benchmarks/ \
            --benchmark-only \
            --benchmark-autosave \
            --benchmark-save-data \
            --benchmark-storage=benchmarks/results

      # GH Actions: ``if:`` REPLACES the implicit success() check. Without
      # the explicit success(), this step would run against partial JSON
      # if the prior Run step SIGBUSed, masking the original failure.
      - name: Check Tier-1 + Tier-2 thresholds
        if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: uv run python benchmarks/regression/check.py --include-tier2 --strict

      # ==========================================================
      # Tier-2 N=20 fresh-subprocess orchestrator runs (workflow_dispatch
      # + scheduled only — too slow for push-to-main). Each scenario =
      # 20 fresh subprocesses; full suite ~30-60 min wall clock per Step
      # 16 plan §3.2.
      # ==========================================================
      - name: Run Tier-2 N=20 orchestrator (slow)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          PYFORGE_REDIS_URL: redis://127.0.0.1:6379/0
          PYFORGE_RUN_LARGE_BENCH: "1"
          PYFORGE_RUN_RECORD_BENCH: "1"
        run: |
          for spec in benchmarks/runs/specs/*.yml; do
            name=$(basename "${spec%.yml}")
            uv run python benchmarks/runs/repeat.py \
              --bench-spec "$spec" \
              --num-runs 20 \
              --output "benchmarks/results/n20/${name}_n20.json" \
              || echo "WARN: orchestrator scenario $name failed; continuing"
          done

      # ==========================================================
      # Step 16b MADV_HUGEPAGE A/B (workflow_dispatch only — never on push,
      # never on schedule). Produces benchmarks/results/madv_ab.json that
      # drives the SHIP/REJECT/REJECT_NOISE_DOMINATED/INCOMPLETE_AB decision
      # per Step 16b plan §10. Standalone orchestrator (NOT pytest-driven);
      # spawns 40 fresh subprocesses (N=20 per side); ~5-10 min wall-clock.
      #
      # Sysfs state (transparent_hugepage/enabled + shmem_enabled) gets
      # captured into the JSON so a measured ~1.0x can be distinguished
      # from "kernel didn't grant hugepages" (Step 16b plan Rev-6 issue #3).
      #
      # Exit codes: 0 SHIP, 2 REJECT (either flavor), 3 INCOMPLETE_AB.
      # `continue-on-error: true` lets a non-zero (REJECT/INCOMPLETE_AB)
      # exit not fail the whole job — the JSON artifact is the decision
      # carrier, not the step status. Operator reads madv_ab.json and
      # picks SHIP-vs-REJECT-vs-re-trigger per plan §10.
      # ==========================================================
      - name: Run Step 16b MADV_HUGEPAGE A/B (workflow_dispatch only)
        # Step 16b Rev-8: `always() && ...` so MADV runs even if upstream
        # LARGE+RECORD or N=20 step failed. The MADV bench is independent
        # (cold-cache 200-field at capacity=16, ~200 KB segment) — its
        # correctness doesn't depend on the heavy benches passing.
        # Without `always()`, GitHub auto-applies success() to any if:
        # without a status function, so a SIGBUS upstream cascades through
        # all downstream steps. Run #31 caught this: LARGE+RECORD SIGBUSed
        # and MADV got skipped, leaving no madv_ab.json artifact.
        #
        # Step 16b Rev-10: clean /dev/shm pollution from prior workflow
        # steps before running. Run #34 caught this: an upstream SIGBUS
        # in 100k hydration left ~51 pyforge_* segments behind, filling
        # /dev/shm; the orchestrator's subprocesses then SIGBUSed at
        # posix_shm.create() because no room. CI-only cleanup (workflow
        # YAML, not orchestrator) so operator workstation runs don't
        # accidentally unlink segments held by other live processes.
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          rm -f /dev/shm/pyforge_* || true
          uv run python benchmarks/runs/step16_madvise_ab.py \
            --num-runs 20 \
            --output benchmarks/results/madv_ab.json

      # ==========================================================
      # Optional flamegraph capture (manual workflow_dispatch only).
      # py-spy needs ptrace privileges; ubuntu-latest runners have
      # unprivileged ptrace enabled by default.
      # ==========================================================
      - name: Record flamegraphs (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.record_flamegraphs == 'true'
        env:
          PYFORGE_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          mkdir -p benchmarks/results/flamegraphs
          # Driver scripts live in benchmarks/flamegraphs/ — Step 16c lands them.
          # This step is a placeholder; ship as a no-op until 16c.
          echo "flamegraph capture: 16c will populate benchmarks/flamegraphs/*.py"

      # ==========================================================
      # Always upload artifacts so the operator can pull bench JSON +
      # regression-check report.
      # ==========================================================
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/
