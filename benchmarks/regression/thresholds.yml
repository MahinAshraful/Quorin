# Per-benchmark regression thresholds consumed by .github/workflows/benchmark.yml.
#
# Each entry is absolute (seconds, p99 unless noted) so that a lucky fast run on
# a quiet runner cannot silently tighten the bar. Keep in sync with the numbers
# published in the README.
#
# Populated as steps land.
benchmarks:
  # Step 1 — schema compile. Not on the hot path but used during process
  # startup; <1 ms keeps the test suite snappy.
  compile_schema_200_fields:
    p99_seconds: 0.001
  # Step 4 — pure-Python assemble oracle. Conservative ceilings (1.7-2x the
  # spec's upper estimates) so noisy CI runs don't flake. Step 5's Numba
  # kernel will tighten these substantially.
  assemble_4_field_warm:
    p99_seconds: 0.000050   # 50 us — spec target 10-30 us upper bound
  assemble_200_field_warm:
    p99_seconds: 0.001000   # 1 ms — spec target 100-500 us upper bound
  # Step 5 — Numba assembly. 2x and 2.5x headroom over spec targets to
  # absorb CI noise. The 4-field gate is loose because Python lookup
  # (~3 us) sits in the budget; future Numba-fied lookup will close the
  # gap. Crossover and cold-cache scenarios are committed but NOT gated
  # (slow + noisy).
  assemble_4_field_warm_numba:
    p99_seconds: 0.000010   # 10 us — spec target 5 us
  assemble_200_field_warm_numba:
    p99_seconds: 0.000050   # 50 us — spec target 10-20 us
  # Step 6 — buffer pool. Class-based context manager (NOT
  # @contextlib.contextmanager — that costs ~700 ns/call, swamps the
  # np.empty savings the pool exists to capture). Measured hit-only
  # median ~550 ns on WSL2; gate at 1500 ns to absorb CI noise on a
  # sub-microsecond loop with high IQR variance. Pooled assemble must
  # not regress past Step 5's headroom — gates match the Numba
  # thresholds exactly so a regression in the pool path raises the same
  # alarm.
  pool_checkout_hit_only:
    p99_seconds: 0.0000015   # 1.5 us — measured median ~550 ns
  assemble_4_field_warm_pooled:
    p99_seconds: 0.000010    # 10 us — must not regress past Step 5
  assemble_200_field_warm_pooled:
    p99_seconds: 0.000050    # 50 us — must not regress past Step 5
  # Step 8 — batch assembly. The headline 5x gate is N=1000 batch vs 1000
  # single calls; ratio is enforced manually post-run, not by these
  # absolute thresholds. The thresholds below catch regressions in
  # absolute terms. ADR-007 records the actual measured ratio.
  assemble_batch_4_field_n1000:
    p99_seconds: 0.005       # 5 ms — N=1000 4-field; comparator is ~4 ms single calls
  assemble_batch_200_field_n1000:
    p99_seconds: 0.010       # 10 ms — N=1000 200-field; comparator is ~5 ms single calls
