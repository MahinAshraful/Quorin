# Per-benchmark regression thresholds consumed by .github/workflows/benchmark.yml.
#
# Each entry is absolute (seconds, p99 unless noted) so that a lucky fast run on
# a quiet runner cannot silently tighten the bar. Keep in sync with the numbers
# published in the README.
#
# Populated as steps land.
benchmarks:
  # Step 1 — schema compile. Not on the hot path but used during process
  # startup; <1 ms keeps the test suite snappy.
  compile_schema_200_fields:
    p99_seconds: 0.001
  # Step 4 — pure-Python assemble oracle. Conservative ceilings (1.7-2x the
  # spec's upper estimates) so noisy CI runs don't flake. Step 5's Numba
  # kernel will tighten these substantially.
  assemble_4_field_warm:
    p99_seconds: 0.000050   # 50 us — spec target 10-30 us upper bound
  assemble_200_field_warm:
    p99_seconds: 0.001000   # 1 ms — spec target 100-500 us upper bound
  # Step 5 — Numba assembly. 2x and 2.5x headroom over spec targets to
  # absorb CI noise. The 4-field gate is loose because Python lookup
  # (~3 us) sits in the budget; future Numba-fied lookup will close the
  # gap. Crossover and cold-cache scenarios are committed but NOT gated
  # (slow + noisy).
  assemble_4_field_warm_numba:
    p99_seconds: 0.000010   # 10 us — spec target 5 us
  assemble_200_field_warm_numba:
    p99_seconds: 0.000050   # 50 us — spec target 10-20 us
  # Step 6 — buffer pool. Class-based context manager (NOT
  # @contextlib.contextmanager — that costs ~700 ns/call, swamps the
  # np.empty savings the pool exists to capture). Measured hit-only
  # median ~550 ns on WSL2; gate at 1500 ns to absorb CI noise on a
  # sub-microsecond loop with high IQR variance. Pooled assemble must
  # not regress past Step 5's headroom — gates match the Numba
  # thresholds exactly so a regression in the pool path raises the same
  # alarm.
  pool_checkout_hit_only:
    p99_seconds: 0.0000015   # 1.5 us — measured median ~550 ns
  assemble_4_field_warm_pooled:
    p99_seconds: 0.000010    # 10 us — must not regress past Step 5
  assemble_200_field_warm_pooled:
    p99_seconds: 0.000050    # 50 us — must not regress past Step 5
  # Step 8 — batch assembly. The headline 5x gate is N=1000 batch vs 1000
  # single calls; ratio is enforced manually post-run, not by these
  # absolute thresholds. The thresholds below catch regressions in
  # absolute terms. ADR-007 records the actual measured ratio.
  assemble_batch_4_field_n1000:
    p99_seconds: 0.005       # 5 ms — N=1000 4-field; comparator is ~4 ms single calls
  assemble_batch_200_field_n1000:
    p99_seconds: 0.010       # 10 ms — N=1000 200-field; comparator is ~5 ms single calls
  # Step 9 — WAL producer. Two layers of gates:
  #   - wal_write_*: full producer wall-clock (RTT-dominated). Measured
  #     median ~2.9 ms / max ~5 ms on WSL2 + Docker Desktop Redis with
  #     appendfsync everysec. Gate at 8 ms p99 (~60% headroom over max)
  #     so CI noise on docker-shared loopback doesn't flake. The
  #     headline "<2 ms p99" target in ADR-008 is hardware-dependent; CI
  #     just needs to detect "we got dramatically slower," not enforce
  #     SLOs.
  #   - sub-component gates isolate regressions in our code if a
  #     wal_write_* drift appears.
  # The 500 us pydantic gate is the documented escape-hatch trigger — if
  # ever exceeded, ADR-008's parking-lot "swap to hand-rolled validator"
  # opens. Currently measured at 16.7 us / 200 fields, so 30x under.
  wal_write_50_field:
    p99_seconds: 0.008       # 8 ms — RTT-dominated, measured ~3 ms median + headroom
  wal_write_200_field:
    p99_seconds: 0.008       # 8 ms — same; producer CPU adds <120 us
  pydantic_validate_50_field:
    p99_seconds: 0.0001      # 100 us — measured ~5 us median
  pydantic_validate_200_field:
    p99_seconds: 0.0005      # 500 us — escape-hatch trigger; measured ~17 us median
  msgpack_pack_50_field:
    p99_seconds: 0.00005     # 50 us — measured ~1.7 us median
  msgpack_pack_200_field:
    p99_seconds: 0.0001      # 100 us — measured ~7 us median
  # Step 10 — WAL consumer + row_pack. row_pack is the consumer's hot CPU
  # path; consolidated-Struct path validated empirically (ADR-009 §7).
  # Measured: row_pack_50_field ~5.4 us median, row_pack_200_field ~12 us
  # median, row_pack_200_scalar_only ~8 us median. Gate at 30 us / 100 us
  # absorbs CI noise on shared loopback. Bench gate ratios match the
  # numbers in ADR-009 §13.
  row_pack_50_field:
    p99_seconds: 0.00003     # 30 us — measured ~5 us median
  row_pack_200_field:
    p99_seconds: 0.00003     # 30 us — measured ~12 us median, includes 128-emb shaped
  row_pack_200_scalar_only:
    p99_seconds: 0.00003     # 30 us — measured ~8 us median, pure consolidated-Struct
  consumer_apply_per_msg_50_field:
    p99_seconds: 0.0001      # 100 us — measured ~10 us median (decode+pack+insert)
  consumer_apply_per_msg_200_field:
    p99_seconds: 0.0001      # 100 us — measured ~21 us median, includes 128-emb shaped
  # Step 11 — ParquetDatasetStore. Bench job is 2x regression detection
  # for append (e.g. someone reintroducing dict lookups), and absolute
  # ceilings for flush calibrated to 4x measured WSL2 baseline (NOT 4x
  # native theoretical) — Docker Desktop's WSL2 fsync routes through
  # 9P/virtio-fs to NTFS, ~10x slower than native ext4. Native flush is
  # ~100-150 ms at 10k rows x 200 fields with from_pydict dominating
  # (ADR-010 section 8); WSL2 inflates that by 20-100 ms.
  #
  # NOTE: flush_10k_rows_50_field / flush_10k_rows_200_field gates are
  # PLACEHOLDERS — set on first verification run to 4x measured WSL2
  # p99 and recorded back into ADR-010 section 7.
  append_per_msg_200_field:
    p99_seconds: 0.00002     # 20 us — bench detects 2x regression (reintroduced
                              # dict lookups). Measured median ~6 us on WSL2
                              # (200 list.append x ~30 ns ≈ 6 us floor).
  flush_10k_rows_50_field:
    p99_seconds: 0.3         # 300 ms — 4x measured WSL2 max ~66 ms (median ~31 ms);
                              # from_pydict + zstd + 2x fsync via Docker Desktop 9P.
  flush_10k_rows_200_field:
    p99_seconds: 0.6         # 600 ms — 4x measured WSL2 max ~123 ms (median ~114 ms);
                              # from_pydict at 200 fields x 10k rows dominates (~80-150 ms),
                              # matches ADR-010 section 8 prediction.
  arrow_schema_build_200_field:
    p99_seconds: 0.005       # 5 ms — cold plan build (measured ~258 us median, 1.2 ms max)
  # Step 12 — point-in-time reader. Three gated benches; the 10M record
  # bench is intentionally non-gated (PYFORGE_RUN_RECORD_BENCH=1 to run).
  # Methodology mirrors Step 11: 4x measured WSL2 max, with the bench
  # job catching 2x regressions, not enforcing SLOs. PyArrow 14 doesn't
  # expose Table.join_asof; pyforge.offline._asof_join hand-rolls the
  # primitive via numpy.searchsorted (ADR-011 §11). The dominant phase
  # at 1M+ rows is the dataset.to_table load + dedup + sort, not the
  # inner asof loop.
  read_dataset_construction_only:
    p99_seconds: 3.0         # 3 s — measured median 493-600 ms / max 506-725 ms
                              # across two WSL2 hosts (filesystem-listing
                              # variance is ~50%). Scales linearly with
                              # fragment count (physical_schema scan in
                              # _validate_dataset_uniform).
  read_pit_1k_pairs_500k_rows_50_field:
    p99_seconds: 12.0        # 12 s — 4x measured WSL2 max ~3.3 s (median
                              # ~3.1 s). Dominated by dataset.to_table on
                              # ~500k rows + dedup group_by + asof.
  read_pit_10k_pairs_5m_rows_100_field:
    p99_seconds: 60.0        # 60 s — extrapolated from the 500k bench
                              # (10x rows + 10x queries). Verified by
                              # measurement post-impl in Step 12 progress
                              # notes; tightened in Step 16 if real numbers
                              # are dramatically lower.
  # Step 13 — Hydration. Methodology change vs Steps 11/12: gates are
  # set at NATIVE-LINUX targets, not "4x WSL2 measured". CI runs on
  # Ubuntu 24.04 (native Linux); that's where the gates actually
  # block. Steps 11/12 gates use the older "4x WSL2 measured"
  # methodology and are loose by ~4-6x vs the native target — Step
  # 16 should retroactively tighten:
  #   - flush_10k_rows_200_field: 0.6s -> ~0.15-0.2s
  #   - read_pit_1k_pairs_500k_rows_50_field: 12s -> ~3-4s
  # DO NOT tighten in Commit B — out of scope.
  #
  # WSL2 dev runs may exceed these gates due to Docker Desktop 9P +
  # virtio-fs cold-page-fault overhead (~4-6x slower than native ext4
  # on /dev/shm cold writes — see CLAUDE.md §8). For dev-loop
  # ergonomics, dev users running benches on WSL2 should mentally
  # allow up to 4x the gate; if exceeded above 4x even on WSL2,
  # that's a real regression no matter the platform.
  #
  # Enforcement: the workflow currently loads thresholds.yml as a
  # smoke test (prints the dict) but does NOT gate on values. Step 16
  # (per pyforge_build_steps.md "Step 16 — Benchmarks and Flamegraphs"
  # / "Regression guard in CI") wires the actual evaluator with WSL2
  # detection and the two-tier discipline. Until then, regressions
  # are caught by manual inspection of the benchmark JSON output.
  hydrate_10k_50_field_smoke:
    p99_seconds: 1.0         # Smoke variant — always-on (no env gate).
                              # Native target ~0.05-0.2s. 1s gate is
                              # ~5-20x the upper bound; catches order-
                              # of-magnitude regressions only. Finer
                              # detection requires PYFORGE_RUN_LARGE_BENCH=1
                              # on the 100k/1M scales. Mediocre by design;
                              # cheap to run.
  hydrate_100k_50_field:
    p99_seconds: 8.0         # Native target ~0.5-2s. 8s gate gives
                              # 4x headroom for hardware drift but blocks
                              # the "doubled" regression class. WSL2 dev
                              # runs may hit 5-7s — within tolerance but
                              # flag-worthy. Env-gated (PYFORGE_RUN_LARGE_BENCH=1).
  hydrate_1m_200_field:
    p99_seconds: 45.0        # Native target ~5-15s (per CLAUDE.md §8
                              # partial-commit perf findings). 45s gate
                              # is ~3x the upper bound; less headroom
                              # than 100k because the larger scale's
                              # cold-page-fault floor is more variable.
                              # Env-gated (PYFORGE_RUN_LARGE_BENCH=1).
  # No gate for hydrate_10m_200_field_record — capacity-planning only,
  # PYFORGE_RUN_RECORD_BENCH=1.
  # Step 14 — watchdog idle-tick. Bench monkeypatches psutil so the
  # measurement is Redis-tick cost only (HGETALL + 100 dict updates +
  # cleanup_queue drain). Median ~4-5ms on WSL2 / Docker Desktop;
  # native Linux is typically 4-8x faster on Redis HGETALL. 20ms gate
  # gives 4x WSL2 dev-loop tolerance per top-of-file methodology.
  # Real-psutil cost (psutil.Process construction at scale) is parking-
  # lotted for Step 16 if flamegraphs surface it.
  watchdog_tick_idle_100_pids:
    p99_seconds: 0.020       # 20 ms — measured median ~5 ms on WSL2.
