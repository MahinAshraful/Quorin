# Tier-1 regression gates — ALWAYS RUN.
#
# Consumed by ``benchmarks/regression/check.py`` on every PR + push (no env
# gating, no slow marker). Keys must match pytest-benchmark's ``name`` field
# exactly (i.e. the test function name).
#
# Schema (per Step 16 ADR-015 / plan §3.1):
#   <test_function_name>:
#     p50_seconds?:   <gate>   # any subset of percentile fields
#     p95_seconds?:   <gate>
#     p99_seconds?:   <gate>
#     p999_seconds?:  <gate>
#     p9999_seconds?: <gate>
#     comment?:       <free-form>
#
# Each present percentile field is gated independently against
# ``np.percentile(stats.data, q)`` from pytest-benchmark's
# ``--benchmark-save-data`` JSON output. Multiple gates per bench supported
# (e.g. p99 + p999 simultaneously). Missing percentile fields are skipped
# (no over-gating).
#
# Headroom discipline (per ADR-015): default 3x measured native-Linux p99
# baseline; per-bench tightening to 2.5x or 2x allowed where N=20 stddev
# confirms low variance. Step 16 sets initial baselines using the
# canonical ubuntu-24.04 GitHub Actions run.
#
# Duplicate-key guard: a bench may appear in tier1.yml OR tier2.yml, NEVER
# both. ``check.py::_load_thresholds`` raises ValueError on collision (L5).

# -----------------------------------------------------------------------
# Step 1 — schema compile
# -----------------------------------------------------------------------
test_compile_schema_200_fields:
  p99_seconds: 0.001            # 1 ms — startup-only, off the hot path

# -----------------------------------------------------------------------
# Step 4 — Python oracle (assemble baseline; superseded by Numba in Step 5)
# -----------------------------------------------------------------------
test_bench_assemble_4_field_warm:
  # WSL2-tolerant. Run 0002 2026-05-04 measured p99 70.8us; the old 50us gate
  # was calibrated against median (~12us). Native-Linux baseline lands in 16c.
  p99_seconds: 0.000150         # 150us = ~2x WSL2 measured 70.8us p99
test_bench_assemble_200_field_warm:
  # Run 0002 2026-05-04 p99 1018.6us; old 1ms gate was median-calibrated.
  p99_seconds: 0.002500         # 2.5ms = ~2.5x WSL2 measured 1018.6us p99

# -----------------------------------------------------------------------
# Step 5 — Numba assembly (THE 5 us p99 headline claim)
# -----------------------------------------------------------------------
test_bench_assemble_4_field_warm_numba:
  # WSL2-tolerant gate. Single-process pytest-benchmark p99 measured 28.4us on
  # WSL2 / Docker Desktop (run 0001 2026-05-04, 10618 rounds). Median is 4.29us
  # (matches the 5us spec target); p99 is 6-7x median because of OS scheduler
  # noise + GIL hiccups under the Windows host. Native-Linux CI is expected to
  # be 3-5x faster; the canonical N=20 native baseline (Step 16c trip-wire,
  # plan §10) is the source of truth for the headline 5us claim. Until then,
  # this gate is noise-tolerant, not spec-strict.
  p99_seconds: 0.000060         # 60us = ~2x WSL2 measured 28.4us p99
test_bench_assemble_200_field_warm_numba:
  # Same methodology as above. WSL2 p99 measured 50.9us (run 0001 2026-05-04,
  # 49876 rounds); median 5.68us. Spec target 10-20us p99 is for native Linux.
  p99_seconds: 0.000150         # 150us = ~3x WSL2 measured 50.9us p99

# -----------------------------------------------------------------------
# Step 5 / 16 — Numba assembly cold-cache. Step 16 introduced honest
# L3-sized cache-clobber methodology + first Tier-1 gate.
#
# Single-process pytest-benchmark cold-cache shows 3-4x run-to-run
# variance (run 0001 2026-05-04 full-sweep p99 100.9us; targeted solo
# p99 ~33us). Surrounding bench activity warms different cache regions
# and shifts the cold-cache p99 distribution non-trivially. The Tier-2
# N=20 orchestrator is the right tool for the headline cold-cache
# claim; this Tier-1 gate is a GROSS-REGRESSION DETECTOR, not a spec-
# band enforcer.
#
# Gate sizing: 500us = 5x WSL2 full-sweep p99 = ~10x spec upper bound
# (native). Catches order-of-magnitude regressions; passes WSL2 in
# either run state. Native-Linux retightening is 16c work; the spec
# band (20-50us) is verified via the Tier-2 N=20 orchestrator output
# (committed JSON in benchmarks/results/n20/, NOT auto-gated; reviewed
# manually + quoted in the README per ADR-015 §6).
#
# Trip-wire: Tier-2 N=20 native p99 > 50 us after MADV decision ->
# revise README claim with measured number (per ADR-015 §4
# "Cold-cache reality").
# -----------------------------------------------------------------------
test_bench_assemble_200_field_cold_cache_numba:
  p99_seconds: 0.0005           # 500us = 5x WSL2 full-sweep p99 (run 0001)

# -----------------------------------------------------------------------
# Step 6 — buffer pool
# -----------------------------------------------------------------------
test_bench_pool_checkout_hit_only:
  # Sub-microsecond bench: gates on MEDIAN (p50), not p99. The actual
  # ADR-005 perf claim is the ~550ns median — that's what the class-based
  # __enter__/__exit__ design protects vs @contextmanager's ~400-700ns
  # generator-protocol tax. p99 on a 500ns operation is dominated by OS
  # scheduling noise (a single GC pause or scheduler tick is 1-3us =
  # 2-6x the bench cost), not by the operation itself. Across three
  # full-sweep runs the median was rock-stable (580-610ns) while p99
  # ranged 1.2-2.7us. R1 multi-percentile gating (Step 16 ADR-015 §2)
  # makes p50-only gates a first-class pattern.
  #
  # Gate sizing: 1us median = ~1.7x measured 580ns. Catches a 2x median
  # regression (1100ns -> still < 1us would fail at 1.0); rejects sub-2x
  # noise drift. Tighter than the old 1.5us p99 gate in the metric that
  # actually matters.
  p50_seconds: 0.000001         # 1us median ceiling = ~1.7x measured 580ns
test_bench_assemble_4_field_warm_pooled:
  # WSL2-tolerant. Run 0002 2026-05-04 p99 35.7us; old 10us gate was median-
  # calibrated. Same Numba-warm tail-noise envelope as
  # test_bench_assemble_4_field_warm_numba above.
  p99_seconds: 0.000080         # 80us = ~2.2x WSL2 measured 35.7us p99
test_bench_assemble_200_field_warm_pooled:
  # Run 0002 2026-05-04 p99 57.9us.
  p99_seconds: 0.000150         # 150us = ~2.6x WSL2 measured 57.9us p99

# -----------------------------------------------------------------------
# Step 7 / 16 — assemble p999 under GC pressure (P4: NEW in Step 16).
# DIFFERS from existing test_gc_p999_* benches in test_gc_p999.py — those
# measure GC pause durations directly (ADR-006 archive). This bench
# measures assemble latency WHILE GC churn happens, which is the headline
# claim. Pedantic mode with rounds=10000 (C1: avoids the "p999 = max of
# 100 samples" statistical-uselessness Step 7's orchestrator was supposed
# to teach us to avoid).
# -----------------------------------------------------------------------
test_bench_assemble_p999_under_gc_pressure_4_field:
  p99_seconds:  0.000050        # 50 us — placeholder; 3x native baseline post-measurement
  p999_seconds: 0.000200        # 200 us — placeholder; 4x native baseline

# -----------------------------------------------------------------------
# Step 8 — batch assembly. The headline 5x ratio gate is the new
# test_bench_batch_ratio_n1000_vs_n1_4_field assertion (Step 16 P4-adj
# automation; see plan §3.3 row 4).
# -----------------------------------------------------------------------
test_bench_assemble_batch_4_field_n1000:
  # NATIVE CI calibrated. Run 8ded974 2026-05-04 native CI p99 8557us;
  # WSL2 was 9.28ms (older Step 16a sweep). 20ms = ~2.3x native p99.
  # Native is similar speed to WSL2 here.
  p99_seconds: 0.020            # 20ms = ~2.3x native CI 8.56ms p99
test_bench_assemble_batch_200_field_n1000:
  # NATIVE CI calibrated, BUMPED post-first-fail. Run 8ded974 native CI
  # p99 10742us; the prior 10ms gate was set on WSL2 (3.5ms p99) under the
  # false assumption that native would be uniformly faster. Native CI is
  # actually 3x SLOWER on this bench — cache-bound + bandwidth-bound
  # workload, GitHub Actions ubuntu-latest Xeons have smaller L3 than
  # modern desktops. ADR-015 §7 amended with the cache-architecture
  # finding.
  p99_seconds: 0.025            # 25ms = ~2.3x native CI 10.74ms p99
# Plan §3.3 row 4 originally called for a batch-ratio gate
# (test_bench_batch_ratio_n1000_vs_n1_4_field) that would record a RATIO
# between two bench paths. Same constraint as the pool head-to-head below:
# pytest-benchmark records wall-clock per round, not derived ratios. The
# absolute gates above (test_bench_assemble_batch_4_field_n1000 +
# test_bench_assemble_batch_200_field_n1000) catch regressions in either
# path; the 5x ratio assertion (ADR-007) is a manual diff in 16c review
# against committed JSON. Plan deviation noted in progress retro.

# -----------------------------------------------------------------------
# Step 9 — WAL producer (RTT-dominated; gates absorb Docker Desktop
# loopback noise). The 500 us pydantic gate is the documented escape-
# hatch trigger per ADR-008.
# -----------------------------------------------------------------------
test_bench_write_50_field:
  # WSL2-tolerant. Run 0001 2026-05-04 p99 10.83ms; old 8ms gate was
  # median-calibrated (~3ms) with too-tight headroom for WSL2 + Docker
  # Desktop Redis loopback variance. Now uses pedantic(rounds=100) for
  # deterministic p99. Native-Linux baseline lands in 16c.
  p99_seconds: 0.025            # 25ms = ~2.3x WSL2 measured 10.83ms p99
test_bench_write_200_field:
  # Sister bench to write_50_field — same XADD-RTT operation at larger
  # schema, same Docker Desktop loopback variance class. Initial run
  # 0001 (plain benchmark, 55 rounds) showed 3.15ms max → 8ms gate
  # passed by luck. Run 0001 2026-05-04 (plain benchmark, 42 rounds)
  # showed max 9.29ms → gate breached. Conclusion: write_200's tail
  # variance is identical to write_50's; the previous gate was set on
  # a single under-sampled run. Now uses pedantic(rounds=100); gate
  # matches write_50 since they share variance class.
  p99_seconds: 0.025            # 25ms — matches write_50 (sister bench)
test_bench_pydantic_validate_50_field:
  p99_seconds: 0.0001           # 100 us — measured ~5 us median
test_bench_pydantic_validate_200_field:
  p99_seconds: 0.0005           # 500 us — escape-hatch trigger; measured ~17 us
test_bench_msgpack_pack_50_field:
  p99_seconds: 0.00005          # 50 us — measured ~1.7 us median
test_bench_msgpack_pack_200_field:
  p99_seconds: 0.0001           # 100 us — measured ~7 us median

# -----------------------------------------------------------------------
# Step 9 / 16 — write_sync end-to-end RTT (P1: NEW in Step 16).
# Math: 1.5 x max_consumer_cycle(50ms) + backoff_cap(10ms) ~= 85ms,
# rounded to 75ms with the consumer fast-path. Sequential single-producer
# measures one full consumer cycle per call. Concurrent-producer queue-
# depth variant is a Step 17 follow-up if real workloads need sub-50ms.
# -----------------------------------------------------------------------
test_bench_write_sync_rtt_50_field:
  p99_seconds: 0.075            # 75 ms — see math above

# -----------------------------------------------------------------------
# Step 10 — WAL consumer + row_pack (consumer's hot CPU path)
# -----------------------------------------------------------------------
test_row_pack_50_field:
  p99_seconds: 0.00003          # 30 us — passing at WSL2 17.2us p99
test_row_pack_200_field:
  # WSL2-tolerant. Run 0001 2026-05-04 p99 34.8us; old 30us gate was
  # median-calibrated (~12us). The 128-emb shaped field's row_pack tail
  # has more variance than the scalar-only path on WSL2.
  p99_seconds: 0.00008          # 80 us = ~2.3x WSL2 measured 34.8us p99
test_row_pack_200_scalar_only:
  p99_seconds: 0.00003          # 30 us — passing at WSL2 14.4us p99
test_consumer_apply_per_msg_50_field:
  p99_seconds: 0.0001           # 100 us — passing at native CI 55.9us p99 (1.79x margin; borderline but holding)
test_consumer_apply_per_msg_200_field:
  # BUMPED post-Step-16a-CI: native CI run 8ded974 measured p99 85.6us —
  # only 1.17x margin against the 100us gate, will flake within 1-3 CI
  # runs on normal variance. The 128-emb shaped row_pack work has more
  # tail variance on native than on WSL2 (cache architecture per ADR-015
  # §7). 200us = ~2.3x native p99.
  p99_seconds: 0.0002           # 200us = ~2.3x native CI 85.6us p99

# -----------------------------------------------------------------------
# Step 11 — ParquetDatasetStore. flush gates are placeholders set at
# 4x measured WSL2 baseline (NOT 4x native theoretical) — Steps 11/12
# methodology. Step 16 ADR-015 documents the ratchet from 4x WSL2 down
# to 3x native baseline, but this commit (16a) keeps the existing
# numbers; tightening lands in 16c after canonical native baseline.
# -----------------------------------------------------------------------
test_append_per_msg_200_field:
  # BUMPED post-Step-16a-CI: WSL2 measured ~6us (median-calibrated 20us
  # gate had 3.3x headroom on WSL2). Native CI run 8ded974 measured
  # p99 18.9us — only 1.06x margin against the 20us gate, will flake on
  # any normal CI variance. Native CI is slower on this bench than WSL2
  # (different cache architecture per ADR-015 §7). 50us = ~2.6x native p99.
  p99_seconds: 0.00005          # 50us = ~2.6x native CI 18.9us p99
test_flush_10k_rows_50_field:
  p99_seconds: 0.3              # 300 ms — 4x WSL2 max ~66 ms (placeholder)
test_flush_10k_rows_200_field:
  p99_seconds: 0.6              # 600 ms — 4x WSL2 max ~123 ms (placeholder)
test_arrow_schema_build_200_field:
  p99_seconds: 0.005            # 5 ms — measured ~258 us median, 1.2 ms max

# -----------------------------------------------------------------------
# Step 12 — point-in-time reader. read_pit_10k_5m is env-gated and
# lives in tier2.yml.
# -----------------------------------------------------------------------
test_read_dataset_construction_only:
  p99_seconds: 3.0              # 3 s — measured median 493-600 ms (filesystem-listing variance)
test_read_pit_1k_pairs_500k_rows_50_field:
  p99_seconds: 12.0             # 12 s — 4x WSL2 max ~3.3 s (placeholder)

# -----------------------------------------------------------------------
# Step 13 — Hydration smoke. 100k / 1M variants are env-gated and live
# in tier2.yml.
# -----------------------------------------------------------------------
test_hydrate_10k_50_field_smoke:
  p99_seconds: 1.0              # 1 s — smoke; 5-20x native target. Catches
                                # order-of-magnitude regressions only.

# -----------------------------------------------------------------------
# Step 14 — watchdog idle-tick. Bench monkeypatches psutil so the
# measurement is Redis-tick cost only.
# -----------------------------------------------------------------------
test_watchdog_tick_idle_100_pids:
  p99_seconds: 0.020            # 20 ms — measured median ~5 ms on WSL2

# -----------------------------------------------------------------------
# Step 15 — schema evolution
# -----------------------------------------------------------------------
test_bench_upgrade_10k_50_field:
  p99_seconds: 5.0              # 5 s — generous WSL2 ceiling; smoke
test_bench_consumer_pause_overhead:
  p99_seconds: 0.001            # 1 ms — 10-key MGET round-trip on persistent connection

# -----------------------------------------------------------------------
# Step 16 plan §3.3 row 6 originally called for a pool-vs-baseline
# head-to-head gate quantifying ADR-005's "latency-neutral" claim. That
# would require a bench whose recorded value is the DELTA between two
# bench paths — pytest-benchmark records wall-clock per round, not
# differences. Implementing required either a custom timer (overkill)
# or a wrapper that conflated the two paths into one timed call (loses
# signal). Decision: rely on the absolute Tier-1 gates above
# (test_bench_assemble_4_field_warm_pooled vs
# test_bench_assemble_4_field_warm_numba) plus 16c's canonical native-
# Linux baseline run, which ships committed JSON for both paths.
# Pool-vs-baseline delta is then a manual diff in ADR-005 / 16c review,
# NOT a Tier-1 auto-gate. Plan deviation noted in progress retro.
# -----------------------------------------------------------------------
