# Tier-1 regression gates — ALWAYS RUN.
#
# Consumed by ``benchmarks/regression/check.py`` on every PR + push (no env
# gating, no slow marker). Keys must match pytest-benchmark's ``name`` field
# exactly (i.e. the test function name).
#
# Schema (per Step 16 ADR-015 / plan §3.1):
#   <test_function_name>:
#     p50_seconds?:   <gate>   # any subset of percentile fields
#     p95_seconds?:   <gate>
#     p99_seconds?:   <gate>
#     p999_seconds?:  <gate>
#     p9999_seconds?: <gate>
#     comment?:       <free-form>
#
# Each present percentile field is gated independently against
# ``np.percentile(stats.data, q)`` from pytest-benchmark's
# ``--benchmark-save-data`` JSON output.
#
# STEP 16C-D RECALIBRATION (workflow run 25394553451, commit 4818ea4, 2026-05-05):
# Gates retightened from canonical native-CI baselines per ADR-015 §11
# native-CI-first calibration discipline. Two sources:
#   * N=20 fresh-subprocess (benchmarks/results/n20/*_n20.json) — for
#     headline scenarios; rule = 3.0x median(p99), or 2.5x where
#     stddev_p99/median_p99 < 0.05. None of the N=20 scenarios qualify
#     for 2.5x (all have stddev_ratio 9-26%); all use 3.0x.
#   * Single-process Tier-1 JSON (benchmarks/results/Linux-CPython-*/
#     0001_4818ea4*.json) — for benches not covered by N=20; rule =
#     3.0x measured p99. "Tightening only" discipline: gates that would
#     LOOSEN under the rule are kept at their previous tighter value.
#
# Duplicate-key guard: a bench may appear in tier1.yml OR tier2.yml, NEVER
# both. ``check.py::_load_thresholds`` raises ValueError on collision (L5).

# -----------------------------------------------------------------------
# Step 1 — schema compile
# -----------------------------------------------------------------------
test_compile_schema_200_fields:
  p99_seconds: 0.001            # 1 ms — startup-only, off the hot path

# -----------------------------------------------------------------------
# Step 4 — Python oracle (assemble baseline; superseded by Numba in Step 5)
# -----------------------------------------------------------------------
test_bench_assemble_4_field_warm:
  # NATIVE CI calibrated. Run 25394553451 single-process p99 = 32.0us.
  # New gate = 3.0x p99 = 96us. Was 150us (WSL2-tolerant).
  p99_seconds: 0.000096         # 96us = ~3x native CI 32.01us p99
test_bench_assemble_200_field_warm:
  # NATIVE CI calibrated. Run 25394553451 p99 = 1023.25us; 3x = 3070us
  # is LOOSER than the existing 2500us WSL2-tolerant gate, so we keep
  # the tighter 2500us per "tightening only" discipline.
  p99_seconds: 0.002500         # 2.5ms — kept (3x native would loosen to 3.07ms)

# -----------------------------------------------------------------------
# Step 5 — Numba assembly (THE 5 us p99 headline claim — RATIFIED GREEN)
# -----------------------------------------------------------------------
test_bench_assemble_4_field_warm_numba:
  # NATIVE CI N=20 baseline. n20/headline_4_field_warm_n20.json:
  #   median_p50  = 4.14us
  #   median_p99  = 4.48us  <-- 5us SPEC MET
  #   stddev_p99  = 1.18us  (stddev_ratio 26.3%)
  # New gate = 3.0x median_p99 = 13.4us. Was 60us (WSL2-tolerant).
  # Trip-wire ratification: GREEN. README quotes 4.5us p99 on native CI.
  p99_seconds: 0.000013         # 13us = 3x N=20 median_p99 4.48us
test_bench_assemble_200_field_warm_numba:
  # NATIVE CI N=20 baseline. n20/headline_200_field_warm_n20.json:
  #   median_p50  = 7.59us, median_p99 = 11.66us, stddev_p99 = 1.10us (9.4%).
  # New gate = 3.0x median_p99 = 35us. Was 150us (WSL2-tolerant).
  # Spec band 10-20us p99 — measured INSIDE band on native CI.
  p99_seconds: 0.000035         # 35us = 3x N=20 median_p99 11.66us

# -----------------------------------------------------------------------
# Step 5 / 16 — Numba assembly cold-cache.
#
# NATIVE CI N=20 baseline. n20/headline_200_field_cold_n20.json:
#   median_p50  = 31.28us, median_p99 = 66.14us, stddev_p99 = 7.84us (11.9%).
# Spec band 20-50us p99 — measured 66us is slightly OVER band; per
# ADR-015 §4 honest-disclosure-2, single-process cold-cache has 3-4x
# variance, and N=20's 11.9% stddev is on the LOW end. The 66us
# measurement is the canonical native-CI cold-cache number; README
# quotes it with venue disclosure.
# New gate = 3.0x median_p99 = 198us. Was 500us (gross-regression detector).
# -----------------------------------------------------------------------
test_bench_assemble_200_field_cold_cache_numba:
  p99_seconds: 0.000200         # 200us = 3x N=20 median_p99 66.14us

# -----------------------------------------------------------------------
# Step 6 — buffer pool
# -----------------------------------------------------------------------
test_bench_pool_checkout_hit_only:
  # Sub-microsecond bench: gates on MEDIAN (p50), not p99. NATIVE CI
  # single-process p50 = 683ns. 3x = 2.05us would LOOSEN the existing
  # 1us gate; "tightening only" keeps the existing tighter gate.
  # ADR-005's ~550ns median claim is now ~683ns on native CI; ADR-005
  # amendment in Step 16c Commit B records the measured native-CI delta.
  p50_seconds: 0.000001         # 1us median ceiling — kept tight (1.46x measured)
test_bench_assemble_4_field_warm_pooled:
  # NATIVE CI calibrated. Run 25394553451 p99 = 8.70us. 3x = 26us.
  # Was 80us (WSL2-tolerant). Pool overhead = pooled.p99 - numba.p99 =
  # 8.70 - 6.61 = +2.09us at 4-field on native CI. ADR-005 amended to
  # disclose the honest native-CI overhead (was claimed +0.5us).
  p99_seconds: 0.000026         # 26us = 3x native CI 8.70us p99
test_bench_assemble_200_field_warm_pooled:
  # NATIVE CI calibrated. Run 25394553451 p99 = 16.03us. 3x = 48us.
  # Was 150us. Pool overhead at 200-field = +3.90us (vs +0.5us claim).
  p99_seconds: 0.000048         # 48us = 3x native CI 16.03us p99

# -----------------------------------------------------------------------
# Step 7 / 16 — assemble p999 under GC pressure (P4)
#
# NATIVE CI N=20 baseline. n20/gc_p999_pressure_n20.json:
#   median_p99   = 17.88us, stddev_p99   = 4.09us (22.9%)
#   median_p999  = 22.44us
# Both percentile gates retightened from 3x the respective median.
# -----------------------------------------------------------------------
test_bench_assemble_p999_under_gc_pressure_4_field:
  p99_seconds:  0.000054        # 54us = 3x N=20 median_p99 17.88us
  p999_seconds: 0.000070        # 70us = 3x N=20 median_p999 22.44us

# -----------------------------------------------------------------------
# Step 8 — batch assembly. ADR-007's 5x ratio claim is a manual diff in
# 16c Commit B review; native CI measured 1.46x (4-field) and 1.73x
# (200-field) — ADR-007 amended with honest native-CI ratios.
# -----------------------------------------------------------------------
test_bench_assemble_batch_4_field_n1000:
  # NATIVE CI calibrated. Run 25394553451 p99 = 5577us. 3x = 16.7ms.
  # Was 20ms. ADR-015 §7 cache-bound finding: native CI is slower than
  # WSL2 here; the 17ms gate is honest at 3x measured.
  p99_seconds: 0.017            # 17ms = 3x native CI 5.58ms p99
test_bench_assemble_batch_200_field_n1000:
  # NATIVE CI calibrated. Run 25394553451 p99 = 5076us. 3x = 15.2ms.
  # Was 25ms.
  p99_seconds: 0.016            # 16ms = ~3x native CI 5.08ms p99
# Batch ratio ≥ 4.5x is a manual review (progress/step16c_review.md).
# Run 25394553451: 4-field 1.46x, 200-field 1.73x — both BREACH the 5x
# claim. ADR-007 amended in Step 16c Commit B.

# -----------------------------------------------------------------------
# Step 9 — WAL producer (RTT-dominated; native CI is ~50x faster than
# WSL2 here because Docker Desktop loopback was the bottleneck on WSL2).
# -----------------------------------------------------------------------
test_bench_write_50_field:
  # NATIVE CI calibrated. Run 25394553451 p99 = 199us (WSL2 was 10.83ms;
  # 50x faster on native CI Redis loopback). 3x = 596us. Was 25ms.
  p99_seconds: 0.000600         # 600us = 3x native CI 199us p99
test_bench_write_200_field:
  # NATIVE CI calibrated. Run 25394553451 p99 = 266us. 3x = 798us.
  # Was 25ms.
  p99_seconds: 0.000800         # 800us = 3x native CI 266us p99
test_bench_pydantic_validate_50_field:
  # NATIVE CI calibrated. Run 25394553451 p99 = 10.86us. 3x = 33us.
  # Was 100us.
  p99_seconds: 0.000033         # 33us = 3x native CI 10.86us p99
test_bench_pydantic_validate_200_field:
  # NATIVE CI calibrated. Run 25394553451 p99 = 43.23us. 3x = 130us.
  # Was 500us (escape-hatch trigger; new gate is well under the
  # ADR-008 escape-hatch threshold).
  p99_seconds: 0.000130         # 130us = 3x native CI 43.23us p99
test_bench_msgpack_pack_50_field:
  # NATIVE CI calibrated. Run 25394553451 p99 = 2.00us. 3x = 6us.
  # Was 50us. Sub-microsecond p99; OS scheduler noise floor at this
  # scale — gate may flake on rare CI variance, retighten further if
  # multiple runs come in well under.
  p99_seconds: 0.000006         # 6us = 3x native CI 2.00us p99
test_bench_msgpack_pack_200_field:
  # NATIVE CI calibrated. Run 25394553451 p99 = 12.61us. 3x = 38us.
  # Was 100us.
  p99_seconds: 0.000038         # 38us = 3x native CI 12.61us p99

# -----------------------------------------------------------------------
# Step 9 / 16 — write_sync end-to-end RTT (P1)
#
# NATIVE CI N=20 baseline. n20/write_sync_rtt_n20.json:
#   median_p99 = 2181us, stddev_p99 = 556us (25.5%).
# New gate = 3.0x median_p99 = 6543us. Was 75ms (math: 1.5x consumer
# cycle + backoff cap; the math was generous, native CI runs much
# tighter at 2.2ms median).
# -----------------------------------------------------------------------
test_bench_write_sync_rtt_50_field:
  p99_seconds: 0.0066           # 6.6ms = 3x N=20 median_p99 2181us

# -----------------------------------------------------------------------
# Step 10 — WAL consumer + row_pack (consumer's hot CPU path)
# -----------------------------------------------------------------------
test_row_pack_50_field:
  # NATIVE CI p99 = 25.78us. 3x = 77us would LOOSEN existing 30us gate;
  # "tightening only" keeps 30us. Measured passes at 1.16x headroom.
  p99_seconds: 0.00003          # 30us — kept (tighter than 3x measured)
test_row_pack_200_field:
  # NATIVE CI p99 = 33.61us. 3x = 101us would LOOSEN existing 80us gate;
  # "tightening only" keeps 80us. Measured passes at 2.4x headroom.
  p99_seconds: 0.00008          # 80us — kept (tighter than 3x measured)
test_row_pack_200_scalar_only:
  # NATIVE CI p99 = 14.90us. 3x = 45us would LOOSEN existing 30us gate;
  # kept 30us. Measured passes at 2.0x headroom.
  p99_seconds: 0.00003          # 30us — kept
test_consumer_apply_per_msg_50_field:
  # NATIVE CI p99 = 38.95us. 3x = 117us would LOOSEN existing 100us gate;
  # kept 100us. Measured passes at 2.6x headroom.
  p99_seconds: 0.0001           # 100us — kept
test_consumer_apply_per_msg_200_field:
  # NATIVE CI calibrated. Run 25394553451 p99 = 48.99us. 3x = 147us.
  # Was 200us. Slight tighten.
  p99_seconds: 0.000147         # 147us = 3x native CI 48.99us p99

