# Tier-2 regression gates — ENV-GATED.
#
# Consumed by ``benchmarks/regression/check.py --include-tier2``. Runs only
# on push-to-main and ``workflow_dispatch`` (CI sets PYFORGE_RUN_LARGE_BENCH=1
# and PYFORGE_RUN_RECORD_BENCH=1 for these). PRs run Tier-1 only.
#
# Schema: same as tier1.yml. See tier1.yml header for full doc.
#
# Membership rule: a bench appears in tier1.yml OR tier2.yml, NEVER both.
# ``check.py::_load_thresholds`` raises ValueError on collision (L5 guard).
#
# What lives here vs Tier-1:
#   - Heavy scales: 100k / 1M / 5M-row variants of benches that have a
#     smoke variant in Tier-1.
#   - PYFORGE_RUN_LARGE_BENCH=1 gates: 30s-2min benches.
#   - PYFORGE_RUN_RECORD_BENCH=1 gates: 5min+ benches.
#
# What does NOT live here:
#   - Tier-2 N=20 fresh-subprocess headline runs from
#     ``benchmarks/runs/repeat.py`` produce committed JSON in
#     ``benchmarks/results/n20/`` for human review + README quoting; they
#     are NOT auto-gated in CI (per ADR-015 + plan §3.9 mitigation #3).

# -----------------------------------------------------------------------
# Step 12 — point-in-time reader (PYFORGE_RUN_LARGE_BENCH=1)
# -----------------------------------------------------------------------
test_read_pit_10k_pairs_5m_rows_100_field:
  p99_seconds: 60.0             # 60 s — extrapolated from 500k bench

# -----------------------------------------------------------------------
# Step 13 — Hydration heavy variants (Step 16b Rev-11: OPERATOR-VERIFIED)
#
# Both test_hydrate_100k_50_field (~1 GB peak) and test_hydrate_1m_200_field
# (~6 GB peak) are INTENTIONALLY ABSENT from this gate file. ubuntu-latest
# (~3.5 GB /dev/shm) cumulative-SIGBUSes on 100k hydration after Tier-1 +
# 100k upgrade benches accumulate state. 1M hydration exceeds the venue
# ceiling outright. Both benches gate on PYFORGE_RUN_LARGE_SHM_BENCH=1 in
# their pytest.mark.skipif, only set on workflow_dispatch with
# `-f run_large_shm_bench=true`. Operator-verified contracts live in
# the bench docstrings + ADR-015 §7 venue gap analysis. Same pattern as
# the 1M evolution bench below (Step 16b Rev-7 fix #A).
# -----------------------------------------------------------------------

# -----------------------------------------------------------------------
# Step 15 — schema evolution heavy variants
# -----------------------------------------------------------------------
test_bench_upgrade_100k_50_field:
  p99_seconds: 10.0             # 10 s — primary gate (PYFORGE_RUN_LARGE_BENCH=1)
# 1M-rows-x-50-fields evolution bench — INTENTIONALLY UNGATED (Step 16b).
# The 10 s spec-acceptance commitment is OPERATOR-VERIFIED, not CI-verified:
# ubuntu-latest (~3.5 GB /dev/shm) cannot host the bench (~3.2 GB segment).
# A framework gate here would make `check.py --include-tier2 --strict` FAIL
# on `schedule` events (gated bench absent from JSON = MISS = strict FAIL).
# The 10 s contract lives in the bench docstring + ADR-014 amendment + the
# Step 15 progress entry's measurement-of-record (WSL2 9.91 s). See
# ADR-015 §7 for the venue gap analysis. The bench function name is
# referenced in benchmarks/test_evolution_benchmark.py and ADR-014.
