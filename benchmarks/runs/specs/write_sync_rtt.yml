# write_sync end-to-end RTT: producer.write_sync() -> consumer applies ->
# quorin:processed:{msg_id} flag set. Sequential single-producer; one full
# consumer cycle per call drives p99 to ~50-60ms before backoff jitter.
# Tier-1 gate is 75ms (math: 1.5x max_consumer_cycle + backoff_cap).
# Tier-2 N=20 here records the headline number for the README's durability
# section.
name: write_sync_rtt
description: WAL producer write_sync() round-trip latency (p50/p95/p99)
test_path: benchmarks/test_wal_benchmark.py::test_bench_write_sync_rtt_50_field
percentiles: [50, 95, 99, 999]
warmup_runs: 1
# Generous timeout: each round = full consumer cycle (~50ms); pytest-benchmark
# auto-calibration at min_rounds=5 should converge in ~10-30s, but Redis
# fixture init + integration tax push wall clock to ~60-90s per subprocess.
timeout_seconds: 300
