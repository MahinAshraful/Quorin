[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quorin"
version = "0.1.1"
description = "Low-latency ML feature serving via shared memory."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mahin Ashraful", email = "mahinashraful08@gmail.com" }]
keywords = [
  "machine-learning",
  "feature-store",
  "feature-serving",
  "online-inference",
  "shared-memory",
  "ipc",
  "posix-ipc",
  "low-latency",
  "numba",
  "pyarrow",
  "redis-streams",
  "wal",
  "ml-platform",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
]

dependencies = [
  "numpy>=1.26,<2.0",
  "numba>=0.59,<0.61",
  "pyarrow>=14.0,<15.0",
  "redis>=5.0,<6.0",
  "pydantic>=2.5,<3.0",
  # CR.B.11: pin psutil <6.0. The watchdog's correctness foundation is
  # `psutil.Process(pid).create_time()` for PID-reuse detection. Cross-major
  # divergence in create_time semantics could silently break the dead-PID
  # cleanup path. Pin tight; widen after verifying compatibility on >=6.0.
  "psutil>=5.9,<6.0",
  "structlog>=24.0",
  "prometheus-client>=0.19",
  "msgpack>=1.0,<2.0",
  # POSIX IPC — used by quorin._internal.posix_shm to bypass CPython's
  # multiprocessing.shared_memory resource_tracker bug. Linux/macOS only;
  # native Windows is not a supported platform per the spec.
  "posix-ipc>=1.1,<2.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-benchmark>=4.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "py-spy>=0.3",
  "pre-commit>=3.7",
]

[project.urls]
Homepage      = "https://github.com/MahinAshraful/Quorin"
Documentation = "https://github.com/MahinAshraful/Quorin#readme"
Repository    = "https://github.com/MahinAshraful/Quorin.git"
Issues        = "https://github.com/MahinAshraful/Quorin/issues"
Changelog     = "https://github.com/MahinAshraful/Quorin/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["quorin"]
# CR.H.8 (v0.1.1): explicitly include py.typed marker so downstream
# consumers' mypy --strict picks up our type information. ``packages``
# above already pulls everything in the directory, but listing it
# here is the documented hatchling pattern + survives any future
# include/exclude pruning.
include = ["quorin/py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# tests/_helpers.py holds pack_row and other shared test infrastructure used
# across unit/property/integration. Adding "tests" to pythonpath lets test
# files do ``from _helpers import pack_row`` without conftest fixture-wrapping.
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: requires Redis (docker-compose up -d)",
  "chaos: SIGKILL / crash-safety scenarios",
  "property: Hypothesis-driven",
  "slow: long-running",
]
asyncio_mode = "auto"
# CR.E.6 / v0.1.1: silence the socket_timeout UserWarning from test
# fixtures that intentionally construct minimal Redis clients (chaos
# subprocess code, third-party-style tests). Production users still
# see the warning at WALProducer / WALConsumer / heartbeat
# construction; tests don't need to mirror the production-correct
# pattern in every fixture (the central conftest fixture already does).
filterwarnings = [
  "ignore:.*socket_timeout configured.*:UserWarning",
]

[tool.coverage.run]
source = ["quorin"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
